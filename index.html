
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeBonk Launcher</title>

  <style>
    body {
      margin: 0;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .launcher {
      text-align: center;
    }

    h1 {
      font-size: 48px;
    }

    button {
      padding: 18px 55px;
      background: #397df5;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    button:hover {
      background: #2463d4;
    }
  </style>
</head>

<body>
  <div class="launcher">
    <h1>POKEBONK</h1>
    <p>Ready to play?</p>

    <button onclick="launchGame()">
      PLAY
    </button>
  </div>

  <script>
    function launchGame() {
      window.location.assign("https://pokebonk.com");
    }
  </script>
</body>
</html>
